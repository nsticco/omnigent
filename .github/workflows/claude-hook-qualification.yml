name: Claude hook cancellation qualification

on:
  push:
    branches: [feat/profile-command-hooks]

permissions:
  contents: read

concurrency:
  group: claude-hook-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation:
    if: github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
      UV_INDEX_URL: https://pypi.org/simple
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Install terminal prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Install locked runtime and test dependencies
        run: uv sync --locked --extra all --group test
      - uses: ./.github/actions/setup-harness-cli
        with:
          harness: claude
          version: 2.1.281
          enable-cache: false
      - name: Require actual terminal and CLI prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v tmux
          tmux -V
          command -v claude
          test "$(claude --version)" = '2.1.281 (Claude Code)'
          uv run --no-sync python -c 'from omnigent.inner.terminal import TerminalInstance'
      - name: Qualify cancellation through the real terminal owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          uv run --no-sync pytest \
            tests/harnesses/claude_native/test_authored_hooks_cli.py \
            -k cancel --reruns 0 --override-ini addopts='' \
            --junitxml=artifacts/claude-hook-cancellation.xml \
            2>&1 | tee artifacts/claude-hook-cancellation.log
      - name: Require three executed cancellation cases without skips
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path('artifacts/claude-hook-cancellation.xml')
          assert report.is_file(), 'Cancellation test report is missing'
          cases = ElementTree.parse(report).findall('.//testcase')
          expected = {
              f'test_installed_claude_authored_hooks[cancel-{mode}]'
              for mode in ('native', 'all', 'none')
          }
          assert len(cases) == 3, f'Expected three cases, got {len(cases)}'
          assert {case.attrib['name'] for case in cases} == expected
          for case in cases:
              assert not any(case.find(kind) is not None for kind in ('skipped', 'failure', 'error')), case.attrib
          print('All three real managed-terminal cancellation cases passed without skips')
          PY
      - name: Upload synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-hook-cancellation-${{ github.sha }}
          path: artifacts/claude-hook-cancellation.*
          if-no-files-found: warn
          retention-days: 7
